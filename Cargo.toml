[workspace]
members = ["crates/*"]
resolver = "3"

# Shared by every crate; the release version lives here only.
[workspace.package]
version = "0.6.0"
edition = "2024"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
ureq = { version = "2", default-features = false }
assert_cmd = "2"
predicates = "2"
