[package]
name = "ai-workspace"
version = "0.4.0"
edition = "2024"
description = "Local-first AI workspace manager for Fedora"

[[bin]]
name = "ai"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
toml = "0.8"

[dev-dependencies]
assert_cmd = "2"
predicates = "2"
