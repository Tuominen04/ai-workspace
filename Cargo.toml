[workspace]
members = ["crates/*", "desktop/src-tauri"]
# The desktop app needs WebKitGTK to build, so plain `cargo build`/`test`/`run` at the root
# build only the core and the CLI. Use `--workspace` or `-p ai-workspace-desktop` for it.
default-members = ["crates/*"]
resolver = "3"

# Shared by every crate; the release version lives here only.
[workspace.package]
version = "0.9.0"
edition = "2024"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
ureq = { version = "2", default-features = false }
# Deleting a project moves it to the desktop Trash (ADR-0015). Default features only: the
# freedesktop implementation (libc, scopeguard, urlencoding); no `portal`, so no D-Bus.
trash = "5.4"
assert_cmd = "2"
predicates = "2"
