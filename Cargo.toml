[package]
name = "ai-workspace"
version = "0.5.0"
edition = "2024"
description = "Local-first AI workspace manager for Fedora"

[[bin]]
name = "ai"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
ureq = { version = "2", default-features = false }

[dev-dependencies]
assert_cmd = "2"
predicates = "2"
