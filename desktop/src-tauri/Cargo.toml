[package]
name = "ai-workspace-desktop"
description = "Desktop app for AI Workspace"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[lib]
name = "aiw_desktop"
path = "src/lib.rs"

[[bin]]
name = "ai-workspace-desktop"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
ai-workspace-core = { path = "../../crates/ai-workspace-core" }
tauri = { version = "2", features = [] }
serde = { workspace = true }
ts-rs = "12"
