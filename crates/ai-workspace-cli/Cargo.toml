[package]
name = "ai-workspace-cli"
description = "Local-first AI workspace manager for Fedora"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[lib]
name = "ai_workspace"
path = "src/lib.rs"

[[bin]]
name = "ai-workspace"
path = "src/main.rs"

[dependencies]
ai-workspace-core = { path = "../ai-workspace-core" }

[dev-dependencies]
assert_cmd.workspace = true
predicates.workspace = true

# Not used since ADR-0010: releases ship only the desktop app. Kept so the command line
# can be packaged again with `cargo generate-rpm -p crates/ai-workspace-cli --auto-req builtin`.
# Version, license and summary come from [package].
[package.metadata.generate-rpm]
name = "ai-workspace"
# The package runs no install scripts, so it does not need a shell.
require-sh = false
assets = [
    { source = "target/release/ai-workspace", dest = "/usr/bin/ai-workspace", mode = "755" },
    { source = "LICENSE-MIT", dest = "/usr/share/licenses/ai-workspace/LICENSE-MIT", mode = "644" },
    { source = "LICENSE-APACHE", dest = "/usr/share/licenses/ai-workspace/LICENSE-APACHE", mode = "644" },
]
