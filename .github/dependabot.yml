# Dependabot version updates: one weekly pull request per ecosystem, grouped so a week's
# updates arrive together. Security updates (for known vulnerabilities) come on their own as
# soon as an advisory is published; they are turned on in the repository settings.

version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    groups:
      rust:
        patterns: ["*"]
    ignore:
      # ureq 3 has no per-read timeout, which the streamed chat relies on (ADR-0013); the move
      # waits for its own change (issue #63).
      - dependency-name: ureq
        update-types: ["version-update:semver-major"]

  - package-ecosystem: npm
    directory: /desktop
    schedule:
      interval: weekly
    groups:
      npm:
        patterns: ["*"]
    ignore:
      # typescript-eslint 8 does not support TypeScript 7 yet, so npm cannot install both;
      # remove this once it does.
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
