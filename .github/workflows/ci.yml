name: CI

# Format, lint and test on every pull request and every push to main, so a change that
# breaks any of them is seen before it is merged. Read-only: this workflow writes nothing.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable
          components: rustfmt, clippy

      - name: Format
        run: cargo fmt --check

      - name: Lint
        run: cargo clippy --locked --all-targets -- -D warnings

      # Tests that run the binary set AI_WORKSPACE_HOME, HOME and XDG_CONFIG_HOME to
      # temporary folders, and the runtime tests use a local mock server, so no Ollama
      # is needed here.
      - name: Test
        run: cargo test --locked
