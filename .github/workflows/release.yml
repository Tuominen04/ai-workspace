name: Release

# Pushing a version tag builds the Linux packages (the desktop app, installed as the
# `ai-workspace` command; ADR-0010) and opens a draft release with it. Nothing
# is published until the maintainer reads the draft and presses Publish.
#
# See docs/release.md for the procedure and specs/007-release-packaging/ for the design.

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  # A release is cut from main and names the version it ships; checked before anything is
  # built.
  checks:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      # Cheap early exit. This job can only see published releases; the draft job repeats
      # the check with write access, which also sees drafts.
      - name: Release must not exist
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::error::a release for $GITHUB_REF_NAME already exists"
            exit 1
          fi

      - name: Tag is on main
        run: |
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main \
            || { echo "::error::$GITHUB_REF_NAME is not on main"; exit 1; }

      # The version lives once, under [workspace.package] in the root Cargo.toml.
      - name: Tag matches the version
        run: |
          version="${GITHUB_REF_NAME#v}"
          found=$(sed -nE 's/^version = "(.*)"/\1/p' Cargo.toml | head -1)
          [ "$found" = "$version" ] \
            || { echo "::error::Cargo.toml says $found, the tag says $version"; exit 1; }

  # The same build and smoke tests that pull requests touching the packaging run
  # (packages.yml): the .rpm, the .deb and the AppImage, uploaded as the `packages` artifact.
  build:
    needs: checks
    permissions:
      contents: read
    uses: ./.github/workflows/packages.yml

  # Separate from the build, so the only job that can write to the repository checks out
  # nothing and runs no project or dependency code.
  draft:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      # Signed build provenance for the package (Sigstore, through GitHub's attestations).
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: packages
          path: dist-release

      # With write access this also finds a draft, which the build job cannot see.
      - name: Release must not exist
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::error::a release for $GITHUB_REF_NAME already exists; it was left unchanged"
            exit 1
          fi

      # States, signed, that these packages were built by this workflow from this tag's commit.
      # Anyone can check it with `gh attestation verify` (docs/release.md); the signed bundle
      # is also attached to the release.
      - name: Attest the packages
        id: attest
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist-release/*.rpm
            dist-release/*.deb
            dist-release/*.AppImage

      - name: Attach the signed provenance
        env:
          BUNDLE: ${{ steps.attest.outputs.bundle-path }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          cp "$BUNDLE" "dist-release/ai-workspace-$version.sigstore.json"

      - name: Draft the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist-release/* \
            --repo "$GITHUB_REPOSITORY" \
            --draft \
            --verify-tag \
            --title "v${GITHUB_REF_NAME#v}" \
            --generate-notes
