name: Release

# Pushing a version tag builds the Fedora package (the desktop app, installed as the
# `ai-workspace` command; ADR-0010) and opens a draft release with it. Nothing
# is published until the maintainer reads the draft and presses Publish.
#
# See docs/release.md for the procedure and specs/007-release-packaging/ for the design.

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      # Cheap early exit. This job can only see published releases; the draft job repeats
      # the check with write access, which also sees drafts.
      - name: Release must not exist
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::error::a release for $GITHUB_REF_NAME already exists"
            exit 1
          fi

      # A release is cut from main and names the version it ships. Either mismatch is a
      # mistake caught here, before anything is built.
      - name: Tag is on main
        run: |
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main \
            || { echo "::error::$GITHUB_REF_NAME is not on main"; exit 1; }

      # The version lives once, under [workspace.package] in the root Cargo.toml.
      - name: Tag matches the version
        run: |
          version="${GITHUB_REF_NAME#v}"
          found=$(sed -nE 's/^version = "(.*)"/\1/p' Cargo.toml | head -1)
          [ "$found" = "$version" ] \
            || { echo "::error::Cargo.toml says $found, the tag says $version"; exit 1; }

      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable

      - name: Tauri's Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      # The lock is committed; a release contains exactly the dependency versions in it.
      - name: Test
        run: cargo test --locked --workspace

      # The released app (ADR-0010): the desktop app, installed as the `ai-workspace`
      # command and package. Tauri's bundler builds the interface, the binary and the rpm;
      # the package name comes from productName in tauri.conf.json, the binary name from
      # mainBinaryName, and the version from the workspace. The CLI crate is tested above
      # but not packaged.
      - name: Package
        working-directory: desktop
        run: |
          npm ci
          npm run tauri build -- --ci -- --locked

      # Install it on Fedora: it must resolve its libraries (WebKitGTK, GTK) from the
      # distribution, be the `ai-workspace` command, and put its launcher in the
      # applications menu. A window cannot be opened here, so this checks the binary links
      # rather than that it draws.
      - name: Smoke test on Fedora
        run: |
          version="${GITHUB_REF_NAME#v}"
          docker run --rm \
            --volume "$PWD/target/release/bundle/rpm:/pkg:ro" \
            --env VERSION="$version" \
            registry.fedoraproject.org/fedora:44 \
            bash -euc '
              dnf install -y /pkg/*.rpm
              got=$(rpm -q --queryformat "%{NAME} %{VERSION}" ai-workspace)
              [ "$got" = "ai-workspace $VERSION" ] \
                || { echo "::error::installed package is \"$got\", expected \"ai-workspace $VERSION\""; exit 1; }
              [ "$(command -v ai-workspace)" = /usr/bin/ai-workspace ]
              ls /usr/share/applications/*.desktop | grep -q "AI Workspace"
              if ldd /usr/bin/ai-workspace | grep "not found"; then
                echo "::error::ai-workspace is missing libraries on Fedora"; exit 1
              fi
            '

      # Tauri names the file after the product, a space included; rename it to what the
      # install guide tells people to look for.
      - name: Collect and checksum
        run: |
          version="${GITHUB_REF_NAME#v}"
          mkdir dist-release
          cp target/release/bundle/rpm/*.rpm "dist-release/ai-workspace-$version.x86_64.rpm"
          cd dist-release
          sha256sum -- * > SHA256SUMS
          cat SHA256SUMS

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: packages
          path: dist-release/
          if-no-files-found: error

  # Separate from the build, so the only job that can write to the repository checks out
  # nothing and runs no project or dependency code.
  draft:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: packages
          path: dist-release

      # With write access this also finds a draft, which the build job cannot see.
      - name: Release must not exist
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::error::a release for $GITHUB_REF_NAME already exists; it was left unchanged"
            exit 1
          fi

      - name: Draft the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist-release/* \
            --repo "$GITHUB_REPOSITORY" \
            --draft \
            --verify-tag \
            --title "v${GITHUB_REF_NAME#v}" \
            --generate-notes
