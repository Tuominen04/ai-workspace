name: Audit

# Known vulnerabilities in dependencies: cargo-deny for the Rust crates (deny.toml) and
# npm audit for the desktop interface. Runs on every pull request and push to main, and weekly,
# so an advisory published after a change was merged is still seen. Read-only.

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "17 5 * * 1"

permissions:
  contents: read

jobs:
  rust:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: EmbarkStudios/cargo-deny-action@17aeb3c839e42274e2b8adf721c8c65edfdc74dd # v2.1.3
        with:
          command: check advisories sources

  npm:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      # Only what ships in the app: development tools (test runners, linters) are left out.
      - name: npm audit
        run: npm audit --omit=dev --audit-level=moderate
