name: Scorecard

# OpenSSF Scorecard: scores the repository's security practices (branch protection, pinned
# actions, token permissions, dependency updates, …). Results appear under Security → Code
# scanning and on the public Scorecard site. Runs on pushes to main and weekly.

on:
  push:
    branches: [main]
  schedule:
    - cron: "23 6 * * 3"

permissions: read-all

jobs:
  analysis:
    # Code scanning results need a public repository (or a paid plan): skipped while private.
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-24.04
    permissions:
      security-events: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ossf/scorecard-action@23f22cd43608bae7a1f1fa2603d7314dee9538a5 # v2.6.0
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true

      - uses: github/codeql-action/upload-sarif@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea # v4.39.4
        with:
          sarif_file: results.sarif
