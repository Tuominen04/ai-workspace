name: CodeQL

# GitHub's code scanning for the Rust crates and the desktop interface's TypeScript. Results
# appear under Security → Code scanning. Runs on pull requests, pushes to main and weekly.

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "41 4 * * 2"

permissions:
  contents: read

jobs:
  analyze:
    # Code scanning results need a public repository (or a paid plan): skipped while private.
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [rust, javascript-typescript]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # No build: CodeQL reads the source of both languages directly.
      - uses: github/codeql-action/init@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea # v4.39.4
        with:
          languages: ${{ matrix.language }}
          build-mode: none

      - uses: github/codeql-action/analyze@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea # v4.39.4
        with:
          category: /language:${{ matrix.language }}
